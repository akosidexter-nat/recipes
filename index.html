<!DOCTYPE html>

    <head>

        <style>
            .home-container {
                max-width: 800px;
                margin: 0 auto;
                padding: 60px 20px;

            }

            h1 {
                font-size: 64px;
                margin-bottom: 10px;
            }

            .subtitle {
                font-size: 20px;
                margin-bottom: 50px;
                opacity: 0.85;
            }

            .recipe-card {
                display: inline-block;
                background: rgba(255, 255, 255, 0.15);

            .recipe-card h2 {

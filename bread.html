<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bread</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page">
            <div class="top-bar">
                <a href="index.html" class="back">← Back</a>
                <button class="add-btn" id="toggle-btn">+ Add Recipe</button>
            </div>
            <h1>🍞 Bread</h1>

            <div id="form-container" class="form-container" style="display:none">
                <form id="add-form">
                    <input type="text" id="name" placeholder="Recipe name" required>
                    <input type="text" id="description" placeholder="Short description">
                    <textarea id="ingredients" placeholder="Ingredients (one per line)" rows="5" required></textarea>
                    <textarea id="steps" placeholder="Steps (one per line)" rows="5" required></textarea>
                    <div class="form-buttons">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="recipe-grid"></div>
        </div>

        <script type="module">
            import { initApp, toggleForm } from './recipes-app.js';
            document.getElementById('toggle-btn').addEventListener('click', toggleForm);
            document.getElementById('cancel-btn').addEventListener('click', toggleForm);
            initApp('bread');
        </script>
    </body>
</html>
